<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        h1 { font-size: 90px; letter-spacing: 4px; }
        h2 { font-size: 24px; margin-top: 10px; margin-bottom: 15px; }
        p { font-size: 16px; color: #d3d9e6; max-width: 500px; margin-bottom: 30px; }
        a {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.2s;
        }
        a:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <h1>404</h1>
    <h2>🚍 Ruta no encontrada</h2>
    <p>La página que estás buscando no existe o fue movida dentro del sistema de Gestión de Transporte.</p>
    <a href="/">Volver al inicio</a>
</body>
</html>
